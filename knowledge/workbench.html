<details><summary>查看收录条文</summary><ul id="catalog"></ul></details>
<form id="query-form"><label for="query" hidden>英文检索问题</label><textarea id="query" rows="2" required maxlength="1000" placeholder="例如：What information must a privacy notice contain?" aria-describedby="scope-note"></textarea><button id="submit">查找依据</button></form>
