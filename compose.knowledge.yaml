services:
  knowledge-db:
    image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: evidence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:?Set KB_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:${KB_DB_PORT:-55439}:5432"
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  knowledge-data:
