name: Offline quality checks
on: [push, pull_request]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-plugin.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/plugin_run.py --input examples/plugin-input.json
      - run: python -m unittest discover -s knowledge -v
