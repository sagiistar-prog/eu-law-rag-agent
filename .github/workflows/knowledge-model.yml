name: Knowledge model regression
on:
  push:
    paths: ['knowledge/**', '.github/workflows/knowledge-model.yml']
  pull_request:
    paths: ['knowledge/**', '.github/workflows/knowledge-model.yml']
jobs:
  bge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: knowledge/requirements.txt
      - run: python -m pip install -r knowledge/requirements.txt
      - run: python knowledge/pipeline.py build --language en --documents knowledge/examples/documents.jsonl --index output/model-ci/index.json --cache-dir .cache/models
      - run: python knowledge/evaluate.py --language en --index output/model-ci/index.json --cases knowledge/evaluation/cases.json --output output/evaluation/ci.json --cache-dir .cache/models --min-hit-rate 1 --max-false-evidence-rate 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-model-regression
          path: output/evaluation/ci.json
          if-no-files-found: ignore
